name: Build privacy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-privacy-apk.yml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'app/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses and install components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build F-Droid release APK
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon assembleFdroidRelease
      - name: Sign APK for direct installation
        run: |
          keytool -genkeypair -v -keystore /tmp/3x-ui-manager-ci.jks -storepass changeit -keypass changeit -alias ci-release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=3X UI Manager CI"
          APK="$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" /tmp/3x-ui-manager-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/3x-ui-manager-ci.jks --ks-pass pass:changeit --key-pass pass:changeit --out /tmp/3X-UI-Manager.apk /tmp/3x-ui-manager-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose /tmp/3X-UI-Manager.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: 3x-ui-manager-signed-apk
          path: /tmp/3X-UI-Manager.apk
          if-no-files-found: error
          retention-days: 14
